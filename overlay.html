<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    .overlay {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* Horizontal guide line through the center of the screen
       Uses a gradient so it fades in from the edges — less harsh */
    .h-line {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 1px;
      transform: translateY(-50%);
      background: linear-gradient(
        to right,
        transparent 0%,
        rgba(255, 255, 255, 0.12) 15%,
        rgba(255, 255, 255, 0.22) 50%,
        rgba(255, 255, 255, 0.12) 85%,
        transparent 100%
      );
    }

    /* Vertical guide line through the center of the screen */
    .v-line {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 1px;
      transform: translateX(-50%);
      background: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(255, 255, 255, 0.12) 15%,
        rgba(255, 255, 255, 0.22) 50%,
        rgba(255, 255, 255, 0.12) 85%,
        transparent 100%
      );
    }

    /* The snap zone box — exactly the same size as our main window
       Positioned at the center of the screen so it shows exactly
       where the window will snap to */
    .snap-zone {
      position: absolute;
      width: 680px;
      height: 520px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 14px;

      /* Gentle pulsing glow so it feels alive, not static */
      animation: pulse 2s ease-in-out infinite;
    }

    /* Outer dashed ring — slightly larger than the snap zone
       Gives a second layer of visual depth to the snap zone */
    .snap-zone::before {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 19px;
      border: 1px dashed rgba(255, 255, 255, 0.1);
    }

    /* Small dot at the exact screen center — the anchor point */
    .center-dot {
      position: absolute;
      width: 5px;
      height: 5px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    @keyframes pulse {
      0%, 100% {
        border-color: rgba(255, 255, 255, 0.2);
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.03);
      }
      50% {
        border-color: rgba(255, 255, 255, 0.38);
        box-shadow: 0 0 40px rgba(255, 255, 255, 0.07);
      }
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="h-line"></div>
    <div class="v-line"></div>
    <div class="snap-zone"></div>
    <div class="center-dot"></div>
  </div>
</body>
</html>
